repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: local
    hooks:
      - id: docs-freshness
        name: docs freshness
        entry: python scripts/check_docs_freshness.py --staged
        language: system
        pass_filenames: false
