version: 1

policy:
  unmatched_code: fail
  archive_docs_are_invalid_owners: true
  notion_is_invalid_owner: true
  handoff_only_satisfies_contract: false

code_paths:
  - "src/**/*.py"
  - "tools/**/*.py"
  - "scripts/**/*.py"
  - "tests/**/*.py"
  - ".github/workflows/**/*.yml"
  - ".pre-commit-config.yaml"

ignored_paths:
  - "docs/**"
  - "data/**"
  - "raw/**"
  - "wiki/**"
  - "graph/**"
  - "db/**"
  - "tmp/**"
  - ".venv/**"
  - ".git/**"
  - "__pycache__/**"
  - "*.pyc"

global_required_on_code_change:
  changed:
    - "docs/handoff/CURRENT_HANDOFF.md"

rules:
  - id: local-kb-pipeline
    paths:
      - "tools/init_db.py"
      - "tools/ingest_url.py"
      - "tools/compile_wiki.py"
      - "tools/html_utils.py"
      - "tools/search_kb.py"
      - "tools/answer.py"
      - "tests/test_compile_wiki.py"
      - "tests/test_search_kb.py"
    contract_docs:
      - "docs/specs/0001-local-kb-pipeline.md"
    procedure_docs:
      - "docs/runbooks/test.md"
      - "docs/runbooks/rebuild-kb.md"

  - id: graph-layer
    paths:
      - "tools/build_graph.py"
      - "tools/graph_path.py"
      - "tools/search_kb.py"
      - "tools/answer.py"
    contract_docs:
      - "docs/specs/0002-graph-layer.md"
    procedure_docs:
      - "docs/runbooks/test.md"
      - "docs/runbooks/rebuild-kb.md"

  - id: google-drive-sync
    paths:
      - "tools/sync_drive.py"
      - "tools/publish_drive.py"
      - "tests/test_sync_drive.py"
      - "tests/test_publish_drive.py"
    contract_docs:
      - "docs/specs/0003-google-drive-sync.md"
      - "docs/adrs/0005-drive-write-scope-and-upload.md"
    procedure_docs:
      - "docs/runbooks/sync-drive.md"
      - "docs/runbooks/test.md"

  - id: local-storage-sync
    paths:
      - "tools/sync_storage.py"
      - "tests/test_sync_storage.py"
    contract_docs:
      - "docs/runbooks/local-storage.md"
    procedure_docs:
      - "docs/runbooks/test.md"

  - id: v04-red-tests
    paths:
      - "tests/test_v04_openclaw_notion_control.py"
      - "tests/test_v04_ingest_local_cli.py"
      - "tests/test_v04_local_rebuild.py"
      - "tests/test_v04_status_notification.py"
    contract_docs:
      - "docs/plans/v04/README.md"
    procedure_docs:
      - "docs/runbooks/test.md"

  - id: openclaw-notion-control
    paths:
      - "tools/openclaw_notion_control.py"
    contract_docs:
      - "docs/runbooks/local-storage.md"
    procedure_docs:
      - "docs/runbooks/test.md"

  - id: openclaw-skill-routing
    paths:
      - "tests/test_openclaw_skills.py"
    contract_docs:
      - "docs/specs/0010-openclaw-usecase-skill-routing.md"
    procedure_docs:
      - "docs/runbooks/test.md"

  - id: ingest-local-cli
    paths:
      - "tools/ingest_local.py"
    contract_docs:
      - "docs/runbooks/local-storage.md"
    procedure_docs:
      - "docs/runbooks/test.md"

  - id: local-rebuild
    paths:
      - "tools/local_rebuild.py"
    contract_docs:
      - "docs/runbooks/rebuild-kb.md"
    procedure_docs:
      - "docs/runbooks/test.md"

  - id: status-notification
    paths:
      - "tools/status_notification.py"
    contract_docs:
      - "docs/runbooks/openclaw-notion.md"
    procedure_docs:
      - "docs/runbooks/test.md"

  - id: docs-workflow-tooling
    paths:
      - "scripts/check_docs_freshness.py"
      - "scripts/finish_task.py"
      - "scripts/sync_notion_handoff.py"
      - "tests/test_check_docs_freshness.py"
      - "tests/test_finish_task.py"
      - ".pre-commit-config.yaml"
      - ".github/workflows/**/*.yml"
    contract_docs:
      - "docs/WORKFLOW.md"
    procedure_docs:
      - "docs/runbooks/test.md"
      - "docs/runbooks/finish-task.md"

  - id: v05-source-pipeline
    paths:
      - "tools/process_source.py"
      - "tools/fetch_url.py"
      - "tools/extractors/**/*.py"
      - "tests/test_v05_process_source.py"
      - "tests/test_v05_fetch_url.py"
      - "tests/test_v05_1_lodestone_extractor.py"
    contract_docs:
      - "docs/specs/0004-v05-source-processing-pipeline.md"
      - "docs/specs/0004a-v05.1-source-processing-hardening.md"
    procedure_docs:
      - "docs/runbooks/process-source.md"
      - "docs/runbooks/process-pending-sources.md"
      - "docs/runbooks/generate-derived-wiki.md"
      - "docs/runbooks/test.md"

  - id: v06-multi-format-source-processing
    paths:
      - "src/**/*.py"
      - "tools/process_source.py"
      - "tools/process_pending_sources.py"
      - "tools/generate_job_wiki.py"
      - "tools/generate_derived_wiki.py"
      - "tools/compile_wiki.py"
      - "tools/search_kb.py"
      - "tests/test_v06_extractors.py"
      - "tests/test_v06_pending_sources.py"
      - "tests/test_v06_job_wiki_generator.py"
      - "tests/test_v06_fts_indexing.py"
    contract_docs:
      - "docs/specs/0005- v06-Multi-format-Source-Processing.md"
    procedure_docs:
      - "docs/runbooks/process-source.md"
      - "docs/runbooks/test.md"

  - id: v07-grounded-ask-pipeline
    paths:
      - "src/query/**/*.py"
      - "src/retrieval/**/*.py"
      - "src/answering/**/*.py"
      - "tools/ask.py"
      - "tests/test_v07_*.py"
    contract_docs:
      - "docs/specs/0007-v07-grounded-ask-pipeline.md"
    procedure_docs:
      - "docs/runbooks/ask.md"
      - "docs/runbooks/test.md"

  - id: v08-domain-graphify-layer
    paths:
      - "src/domain_graph/**/*.py"
      - "src/retrieval/hybrid.py"
      - "tools/rebuild_domain_graph.py"
      - "tools/generate_graph_report.py"
      - "tools/generate_derived_wiki.py"
      - "tools/ask.py"
      - "tests/test_entity_extractor.py"
      - "tests/test_relation_extractor.py"
      - "tests/test_domain_graph_rebuild.py"
      - "tests/test_graph_report.py"
      - "tests/test_derived_wiki.py"
      - "tests/test_hybrid_retrieval.py"
      - "tests/test_v08_e2e.py"
      - "tests/test_v08_5_*.py"
    contract_docs:
      - "docs/specs/0008-v08-ffxiv-domain-graphify-layer-spec.md"
      - "docs/specs/0009-v08_5_managed_wiki_kb_activation_spec.md"
    procedure_docs:
      - "docs/runbooks/test.md"

  - id: v09-guide-ff14-crawler
    paths:
      - "src/guide_ff14/**/*.py"
      - "src/derived_wiki/item_wiki_generator.py"
      - "src/domain_graph/report.py"
      - "src/domain_graph/storage.py"
      - "src/wiki_indexing/wiki_document_scanner.py"
      - "tools/crawl_guide_ff14.py"
      - "tools/generate_item_wiki.py"
      - "tools/compile_wiki.py"
      - "tools/rebuild_domain_graph.py"
      - "tools/init_db.py"
      - "tests/test_guide_ff14_*.py"
    contract_docs:
      - "docs/specs/0011-v09-guide-ff14-official-db-crawler.md"
    procedure_docs:
      - "docs/runbooks/guide-ff14-crawler.md"
      - "docs/runbooks/test.md"
